<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Acceso — Nexo Académico</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/logo/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/icon-180.png">
<meta name="theme-color" content="#070e26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --dark:#04071b; --navy:#154ca9; --blue:#6eaef0; --bg:#060d20;
    --surface:#0a1530; --border:#1a2a4a; --border2:#0f1f35;
    --txt:#e0eaf8; --muted:#4a6080; --soft:#a8c8f0;
    --green:#1a7f5e; --green-lt:#0d2d1e;
    --amber:#b45309; --amber-lt:#2d1e0d;
    --red:#c0392b; --red-lt:#2d0d0d;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  body{min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0px)) 20px calc(48px + env(safe-area-inset-bottom,0px));overflow-y:auto}

  .login-wrap{width:100%;max-width:420px;margin:0 auto}
  .brand{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:44px}
  .brand-logo{height:80px;width:auto;max-width:260px;flex-shrink:0}

  .role-tabs{display:flex;gap:10px;margin-bottom:22px}
  .role-tab{flex:1;padding:13px 12px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;
    cursor:pointer;text-align:center;transition:all .22s cubic-bezier(.4,0,.2,1);display:flex;
    align-items:center;justify-content:center;gap:8px;font-family:inherit}
  .role-tab i{font-size:19px}
  .role-tab.active{background:linear-gradient(135deg,#0a1e40,#0d2550);border-color:var(--blue);color:var(--blue);box-shadow:0 4px 20px rgba(110,174,240,.15)}
  .role-tab:hover:not(.active){background:var(--border2);color:var(--soft);border-color:var(--border2)}

  .card{background:var(--surface);border:.5px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
  .card-title{color:#fff;font-size:17px;font-weight:700;margin-bottom:6px}
  .card-sub{color:var(--muted);font-size:12px;margin-bottom:24px;line-height:1.5}

  label{display:block;color:var(--soft);font-size:11px;font-weight:600;margin-bottom:6px;margin-top:16px}
  .input-wrap{position:relative}
  .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}
  input{
    width:100%;background:var(--dark);border:.5px solid var(--border);
    border-radius:12px;padding:13px 14px 13px 42px;color:var(--txt);
    font-size:16px;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s;
    -webkit-appearance:none;touch-action:manipulation
  }
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(110,174,240,.12)}
  input::placeholder{color:var(--muted)}

  .btn{
    width:100%;background:linear-gradient(135deg,var(--navy),#1a5cc9);color:#fff;border:none;
    border-radius:12px;padding:15px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;margin-top:26px;
    transition:opacity .18s,transform .18s,box-shadow .18s;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 4px 20px rgba(21,76,169,.4)
  }
  .btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 28px rgba(21,76,169,.5)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .btn i{font-size:18px}

  .error-msg{
    background:var(--red-lt);border:.5px solid var(--red);border-radius:10px;
    padding:11px 16px;color:#f08080;font-size:12px;margin-top:14px;display:none;line-height:1.5
  }

  .footer-link{text-align:center;margin-top:22px;color:var(--muted);font-size:12px}
  .footer-link a{color:var(--blue);text-decoration:none;font-weight:500}

  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

  /* ── CUSTOM KEYBOARD ── */
  #ckbd{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#0c1835;border-top:.5px solid #1a2a4a;padding:10px 4px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .2s cubic-bezier(.4,0,.2,1);-webkit-user-select:none;user-select:none}
  #ckbd.ck-open{transform:translateY(0)}
  .ck-row{display:flex;justify-content:center;gap:5px;margin-bottom:7px}
  .ck-row:last-child{margin-bottom:0}
  .ck-key{background:#1c2e52;border:none;border-radius:7px;color:#fff;font-size:18px;font-weight:500;height:46px;flex:1;max-width:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;box-shadow:0 2px 0 #07101e;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .ck-key.ck-pressed{background:#2563eb;transform:scale(.94)}
  .ck-fn{background:#0f1f35;max-width:48px;font-size:16px}
  .ck-shift.ck-on{background:#2563eb}
  .ck-space{max-width:170px;flex:5;font-size:13px;color:#4a6080}
  .ck-done{background:#154ca9;max-width:62px;font-size:13px;font-weight:700;color:#fff}
  .brand-logo{height:80px;width:auto;max-width:260px;flex-shrink:0;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
  .toggle-pass{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 8px;display:flex;align-items:center;font-size:18px;line-height:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:8px}
  .toggle-pass:hover{color:var(--soft);background:var(--border2)}
  #password{padding-right:46px}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <img src="assets/logo/logo_nexo_blanco.png?v=3" class="brand-logo" alt="Nexo">
  </div>

  <div class="role-tabs">
    <button class="role-tab active" id="tab-alumno" onclick="setRole('alumno')">
      <i class="ti ti-user"></i> Soy alumno
    </button>
    <button class="role-tab" id="tab-profesor" onclick="setRole('profesor')">
      <i class="ti ti-chalkboard"></i> Soy profesor
    </button>
  </div>

  <div class="card">
    <div class="card-title" id="card-title">Acceso al área del alumno</div>
    <div class="card-sub" id="card-sub">Introduce tus credenciales para acceder a tu panel.</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <label>Usuario</label>
      <div class="input-wrap">
        <i class="ti ti-user"></i>
        <input type="text" id="email" placeholder="ALU2026MCR" required autocomplete="username">
      </div>

      <label>Contraseña</label>
      <div class="input-wrap">
        <i class="ti ti-lock"></i>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-pass" id="toggle-pass" onmousedown="event.preventDefault()" onclick="togglePass()">
          <i class="ti ti-eye" id="toggle-pass-icon"></i>
        </button>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button type="submit" class="btn" id="btn-login">
        <i class="ti ti-login"></i> Entrar
      </button>
    </form>
  </div>

  <div class="footer-link">
    ¿Problema para acceder? <a href="https://wa.me/34611492592" target="_blank">Contacta con Nexo</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
let currentRole = 'alumno';

function setRole(role) {
  currentRole = role;
  document.getElementById('tab-alumno').classList.toggle('active', role === 'alumno');
  document.getElementById('tab-profesor').classList.toggle('active', role === 'profesor');
  document.getElementById('card-title').textContent =
    role === 'alumno' ? 'Acceso al área del alumno' : 'Acceso al área del profesor';
  document.getElementById('card-sub').textContent =
    role === 'alumno'
      ? 'Introduce tus credenciales para acceder a tu panel.'
      : 'Introduce tus credenciales para acceder al panel de profesores.';
  document.getElementById('error-msg').style.display = 'none';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn    = document.getElementById('btn-login');
  const errEl  = document.getElementById('error-msg');
  const rawInput = document.getElementById('email').value.trim();
  const email    = rawInput.includes('@') ? rawInput : `${rawInput}@nexo.internal`;
  const pass     = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  errEl.style.display = 'none';

  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password: pass });

    if (error) {
      throw new Error('Credenciales incorrectas. Revisa tu usuario y contraseña.');
    }

    // Verify role
    const { data: usuario } = await db
      .from('usuarios')
      .select('rol, activo')
      .eq('id', data.user.id)
      .single();

    if (!usuario || !usuario.activo) {
      await db.auth.signOut();
      throw new Error('Tu cuenta está desactivada. Contacta con Nexo.');
    }

    if (usuario.rol !== currentRole && usuario.rol !== 'admin') {
      await db.auth.signOut();
      throw new Error(
        currentRole === 'alumno'
          ? 'Esta cuenta no es de alumno. ¿Eres profesor? Cambia la pestaña.'
          : 'Esta cuenta no es de profesor. ¿Eres alumno? Cambia la pestaña.'
      );
    }

    // Verificar que existe un perfil en la tabla correspondiente
    if (currentRole === 'alumno') {
      const { data: alumnoRow } = await db.from('alumnos').select('id').eq('usuario_id', data.user.id).maybeSingle();
      if (!alumnoRow) {
        await db.auth.signOut();
        throw new Error('Estas credenciales no corresponden a ningún alumno. Contacta con Nexo para acceder.');
      }
    } else if (currentRole === 'profesor') {
      const { data: profRow } = await db.from('profesores').select('id').eq('usuario_id', data.user.id).maybeSingle();
      if (!profRow) {
        await db.auth.signOut();
        throw new Error('Estas credenciales no corresponden a ningún profesor. Contacta con Nexo para acceder.');
      }
    }

    // Redirect by role
    if (usuario.rol === 'alumno')   window.location.href = BASE_PATH + '/alumno/index.html';
    else if (usuario.rol === 'profesor') window.location.href = BASE_PATH + '/profesor/index.html';
    else if (usuario.rol === 'admin')    window.location.href = BASE_PATH + '/admin/index.html';

  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-login"></i> Entrar';
  }
}

function togglePass() {
  const inp  = document.getElementById('password');
  const icon = document.getElementById('toggle-pass-icon');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  icon.className = show ? 'ti ti-eye-off' : 'ti ti-eye';
}

// Pre-select role from URL param (e.g. ?rol=profesor from the web snippet)
const _rolParam = new URLSearchParams(window.location.search).get('rol');
if (_rolParam === 'profesor' || _rolParam === 'alumno') setRole(_rolParam);

// If already logged in, redirect
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    const { data: u } = await db.from('usuarios').select('rol').eq('id', session.user.id).single();
    if (u?.rol === 'alumno')   window.location.href = BASE_PATH + '/alumno/index.html';
    if (u?.rol === 'profesor') window.location.href = BASE_PATH + '/profesor/index.html';
    if (u?.rol === 'admin')    window.location.href = BASE_PATH + '/admin/index.html';
  }
})();

</script>

<!-- CUSTOM IN-APP KEYBOARD -->
<div id="ckbd"></div>
<script>
(function(){
  const _ck = { tgt: null, caps: false };
  const rows = [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['SHIFT','z','x','c','v','b','n','m','BACK'],
    ['.','@','-','_','SPACE','DONE']
  ];

  function press(k) {
    const isLtr = k.length === 1 && /[a-z]/i.test(k);
    if (isLtr || (k.length===1 && /[0-9.@\-_]/.test(k))) {
      ckType(_ck.caps && isLtr ? k.toUpperCase() : k);
    } else if (k==='SPACE') { ckType(' '); }
    else if (k==='SHIFT')   { ckCaps(); }
    else if (k==='BACK')    { ckDel(); }
    else if (k==='DONE')    { ckClose(); }
  }

  function build() {
    const kb = document.getElementById('ckbd');
    rows.forEach(row => {
      const d = document.createElement('div');
      d.className = 'ck-row';
      row.forEach(k => {
        const b = document.createElement('button');
        b.type = 'button';
        const isLtr = k.length === 1 && /[a-z]/i.test(k);
        let cls = 'ck-key';
        let txt = k;
        if (isLtr)       { b.dataset.l = k; txt = _ck.caps ? k.toUpperCase() : k; }
        if (k==='SHIFT')  { cls += ' ck-fn ck-shift'; txt = '⇧'; }
        if (k==='BACK')   { cls += ' ck-fn'; txt = '⌫'; }
        if (k==='SPACE')  { cls += ' ck-space'; txt = 'espacio'; }
        if (k==='DONE')   { cls += ' ck-done'; txt = 'Listo ✓'; }
        b.className = cls; b.textContent = txt;

        /* MOBILE: touchstart para respuesta inmediata */
        b.addEventListener('touchstart', e => {
          e.preventDefault(); e.stopPropagation();
          b.classList.add('ck-pressed');
          press(k);
        }, {passive:false});
        b.addEventListener('touchend', e => { e.preventDefault(); b.classList.remove('ck-pressed'); }, {passive:false});

        /* PC/ESCRITORIO: mousedown evita que el input pierda foco; click ejecuta */
        b.addEventListener('mousedown', e => e.preventDefault());
        b.addEventListener('click', e => { e.preventDefault(); press(k); });

        d.appendChild(b);
      });
      kb.appendChild(d);
    });
  }

  function ckCaps() { ckSetCaps(!_ck.caps); }

  function ckType(ch) {
    const el = _ck.tgt; if (!el) return;
    let s = 0, e2 = 0;
    try { s = el.selectionStart != null ? el.selectionStart : el.value.length; e2 = el.selectionEnd != null ? el.selectionEnd : s; } catch(_) { s = e2 = el.value.length; }
    el.value = el.value.slice(0, s) + ch + el.value.slice(e2);
    try { el.selectionStart = el.selectionEnd = s + 1; } catch(_) {}
    el.dispatchEvent(new Event('input', {bubbles:true}));
  }

  function ckDel() {
    const el = _ck.tgt; if (!el) return;
    let s = 0, e2 = 0;
    try { s = el.selectionStart != null ? el.selectionStart : el.value.length; e2 = el.selectionEnd != null ? el.selectionEnd : s; } catch(_) { s = e2 = el.value.length; }
    if (s !== e2) { el.value = el.value.slice(0,s)+el.value.slice(e2); try { el.selectionStart=el.selectionEnd=s; } catch(_){} }
    else if (s > 0) { el.value = el.value.slice(0,s-1)+el.value.slice(s); try { el.selectionStart=el.selectionEnd=s-1; } catch(_){} }
    el.dispatchEvent(new Event('input', {bubbles:true}));
  }

  function ckSetCaps(on) {
    _ck.caps = on;
    document.querySelectorAll('[data-l]').forEach(b => { b.textContent = on ? b.dataset.l.toUpperCase() : b.dataset.l; });
    document.querySelectorAll('.ck-shift').forEach(b => b.classList.toggle('ck-on', on));
  }

  function ckOpen(inp) {
    _ck.tgt = inp;
    /* Contraseña siempre en minúsculas para no equivocarse */
    if (inp.type === 'password') ckSetCaps(false);
    inp.focus();
    document.getElementById('ckbd').classList.add('ck-open');
    setTimeout(() => {
      const kb = document.getElementById('ckbd');
      const r  = inp.getBoundingClientRect();
      const vis = window.innerHeight - kb.offsetHeight;
      if (r.bottom > vis - 12) window.scrollBy({top: r.bottom - vis + 40, behavior:'smooth'});
    }, 150);
  }

  function ckClose() {
    document.getElementById('ckbd').classList.remove('ck-open');
    if (_ck.tgt) { _ck.tgt.blur(); _ck.tgt = null; }
  }

  window.addEventListener('DOMContentLoaded', () => {
    /* Solo en móvil/táctil — en PC el teclado nativo funciona bien */
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouch) return;

    build();
    document.querySelectorAll('input').forEach(inp => {
      inp.setAttribute('inputmode', 'none');
      inp.addEventListener('focus',      () => ckOpen(inp));
      inp.addEventListener('click',      () => ckOpen(inp));
      inp.addEventListener('touchstart', e => { e.stopPropagation(); ckOpen(inp); }, {passive:true});
    });
    /* Cerrar al tocar fuera del teclado, inputs y toggle de contraseña */
    document.addEventListener('touchstart', e => {
      if (!e.target.closest('#ckbd') && !e.target.matches('input') && !e.target.closest('.toggle-pass')) ckClose();
    }, {passive:true});
  });
})();
</script>
</body>
</html>
