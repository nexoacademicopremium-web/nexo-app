<!--
  NEXO ACADÉMICO — Widget de acceso para nexoacademico.es
  -------------------------------------------------------
  Uso en Astro/HTML: copiar este bloque donde quieras mostrar el botón "Acceso".
  Ajusta APP_URL si el dominio cambia.
-->

<style>
  .nexo-acceso-wrap {
    position: relative;
    display: inline-block;
  }

  .nexo-acceso-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #154ca9;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    letter-spacing: 0.2px;
  }
  .nexo-acceso-btn:hover { background: #1a5cc9; }
  .nexo-acceso-btn svg { transition: transform 0.2s; }
  .nexo-acceso-btn[aria-expanded="true"] svg { transform: rotate(180deg); }

  .nexo-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #0a1530;
    border: 0.5px solid #1a2a4a;
    border-radius: 10px;
    min-width: 190px;
    box-shadow: 0 12px 32px rgba(4, 7, 27, 0.7);
    overflow: hidden;
    z-index: 1000;
  }
  .nexo-dropdown.open { display: block; }

  .nexo-dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    color: #e0eaf8;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.1s;
    border-bottom: 0.5px solid #0f1f35;
  }
  .nexo-dropdown-item:last-child { border-bottom: none; }
  .nexo-dropdown-item:hover { background: #0f1f35; }

  .nexo-dropdown-item .nexo-icon {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .nexo-icon-alumno { background: #0a1a30; }
  .nexo-icon-profesor { background: #1a0a30; }

  .nexo-dropdown-item .nexo-label { flex: 1; }
  .nexo-dropdown-item .nexo-label-main { display: block; }
  .nexo-dropdown-item .nexo-label-sub {
    display: block;
    color: #4a6080;
    font-size: 11px;
    font-weight: 400;
    margin-top: 1px;
  }
</style>

<div class="nexo-acceso-wrap" id="nexo-acceso-wrap">
  <button
    class="nexo-acceso-btn"
    id="nexo-acceso-btn"
    aria-haspopup="true"
    aria-expanded="false"
    onclick="nexoToggleMenu()"
  >
    Acceso
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="nexo-dropdown" id="nexo-dropdown" role="menu">
    <a class="nexo-dropdown-item" href="https://app.nexoacademico.es/login.html?rol=alumno" role="menuitem">
      <span class="nexo-icon nexo-icon-alumno">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6eaef0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </span>
      <span class="nexo-label">
        <span class="nexo-label-main">Soy alumno</span>
        <span class="nexo-label-sub">Acceder a mi panel</span>
      </span>
    </a>
    <a class="nexo-dropdown-item" href="https://app.nexoacademico.es/login.html?rol=profesor" role="menuitem">
      <span class="nexo-icon nexo-icon-profesor">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9b7ef0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </span>
      <span class="nexo-label">
        <span class="nexo-label-main">Soy profesor</span>
        <span class="nexo-label-sub">Acceder a mi área</span>
      </span>
    </a>
  </div>
</div>

<script>
  function nexoToggleMenu() {
    const btn = document.getElementById('nexo-acceso-btn');
    const dd  = document.getElementById('nexo-dropdown');
    const isOpen = dd.classList.contains('open');
    dd.classList.toggle('open', !isOpen);
    btn.setAttribute('aria-expanded', String(!isOpen));
  }

  document.addEventListener('click', function (e) {
    const wrap = document.getElementById('nexo-acceso-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('nexo-dropdown')?.classList.remove('open');
      document.getElementById('nexo-acceso-btn')?.setAttribute('aria-expanded', 'false');
    }
  });
</script>
